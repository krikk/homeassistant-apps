name: Update upstream versions

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: homeassistant-apps-upstream-update
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare upstream update
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/update-upstream.py

      - name: Start release workflow
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.prepare.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run build.yaml \
            --ref main \
            -f branch="$RELEASE_BRANCH"

          echo "Release workflow requested for $RELEASE_BRANCH"