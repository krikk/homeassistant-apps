name: Build and publish

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Release branch, for example release/termix-26.10.5-2"
        required: true
        type: string

permissions:
  contents: write
  packages: write

# Serialize publication and updates of main/latest.
concurrency:
  group: homeassistant-apps-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Select release branch
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ inputs.branch }}
          PUSH_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            branch="$INPUT_BRANCH"
          else
            branch="$PUSH_BRANCH"
          fi

          git check-ref-format "refs/heads/$branch"

          case "$branch" in
            release/?*) ;;
            *)
              echo "::error::Only release/... branches can be published."
              exit 1
              ;;
          esac

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.branch }}
          fetch-depth: 0

      - name: Pin and validate release commit
        env:
          RELEASE_BRANCH: ${{ steps.source.outputs.branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # A push must build the exact triggering commit, not a later push.
          if [[ "$EVENT_NAME" == "push" ]]; then
            git checkout --detach "$EVENT_SHA"
          else
            git checkout --detach "$(git rev-parse HEAD)"
          fi

          git fetch origin main
          base="$(git rev-parse origin/main)"
          source="$(git rev-parse HEAD)"

          git merge-base --is-ancestor "$base" "$source" || {
            echo "::error::Release branch must contain current main. Merge main into the branch and retry."
            exit 1
          }

          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$source" >> "$GITHUB_ENV"

          echo "Release branch: $RELEASE_BRANCH"
          echo "Base commit: $base"
          echo "Source commit: $source"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, publish and promote
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ steps.source.outputs.branch }}
        shell: bash
        run: bash .github/scripts/release.sh